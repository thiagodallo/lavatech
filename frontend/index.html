<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a2239" />
    <meta
      name="description"
      content="LavaTech organiza a agenda, o checklist de qualidade e o pagamento de estéticas automotivas."
    />
    <meta property="og:title" content="LavaTech" />
    <meta
      property="og:description"
      content="Agenda, checklist de qualidade e pagamento de estéticas automotivas num lugar só."
    />
    <meta property="og:image" content="/og.png" />
    <title>LavaTech | Gestão para estéticas automotivas</title>
    <script>
      window.addEventListener(
        'error',
        function (evento) {
          var alvo = evento.target
          if (!alvo || (alvo.tagName !== 'LINK' && alvo.tagName !== 'SCRIPT')) return
          var endereco = alvo.href || alvo.src || ''
          if (endereco.indexOf('/assets/') === -1) return
          var ultimaRecarga = Number(sessionStorage.getItem('lavatech-recarregou-em') || 0)
          if (Date.now() - ultimaRecarga < 60000) return
          sessionStorage.setItem('lavatech-recarregou-em', String(Date.now()))
          location.reload()
        },
        true,
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
